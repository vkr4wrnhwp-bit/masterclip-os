name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual trigger, so a maintainer can run CI against any branch from the
  # Actions tab without pushing a commit to provoke it. Also the quickest way
  # to confirm Actions is working at all after a settings or billing change,
  # which is otherwise only answerable by pushing and waiting.
  workflow_dispatch:

jobs:
  masterclip:
    name: MASTERCLIP OS typecheck, lint, tests & build
    runs-on: ubuntu-latest
    # The whole suite is roughly ten minutes on a hosted runner. GitHub's
    # default ceiling is six hours, which is what a hung ffmpeg probe or a
    # deadlocked worker test would actually burn before anyone noticed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The QC engine renders and probes real defective MP4s, so ffmpeg is a
      # test dependency, not just a runtime one. The runner image does not
      # ship it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
