name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual trigger, so a maintainer can run CI against any branch from the
  # Actions tab without pushing a commit to provoke it. Also the quickest way
  # to confirm Actions is working at all after a settings or billing change,
  # which is otherwise only answerable by pushing and waiting.
  workflow_dispatch:

jobs:
  masterclip:
    name: MASTERCLIP OS typecheck, lint, tests, browser suite & build
    runs-on: ubuntu-latest
    # The whole suite runs in about four and a half minutes on a hosted
    # runner. GitHub's default ceiling is six hours, which is what a hung
    # ffmpeg probe or a deadlocked worker test would actually burn before
    # anyone noticed. 30 leaves generous headroom without being useless.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The QC engine renders and probes real defective MP4s, so ffmpeg is a
      # test dependency, not just a runtime one. The runner image does not
      # ship it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Before the browser suite: e2e serves the real production build, and
      # scripts/e2e-server.mjs refuses to start without apps/web/dist.
      - run: pnpm build
      # The browser suite is where the offline show, the IndexedDB cache and the
      # Web Audio path are actually verified — the claims no unit test can make.
      # It found three real defects the rest of the suite passed straight over,
      # so it is worth the ~1 minute of browser provisioning.
      #
      # `--with-deps` installs the system libraries Chromium needs on a bare
      # runner. Only chromium: the suite pins one browser project.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Traces and screenshots are retained on failure; without them a red
      # browser job is a stack trace with no picture of the page.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
