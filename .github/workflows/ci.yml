name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  masterclip:
    name: MASTERCLIP OS typecheck, lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The QC engine renders and probes real defective MP4s, so ffmpeg is a
      # test dependency, not just a runtime one. The runner image does not
      # ship it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Browser checks use disposable SQLite and sandbox mode; never production.
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: First-film desktop and mobile WebKit smoke
        run: pnpm exec playwright test tests/e2e/motion-first-film.spec.ts tests/e2e/motion-audio.spec.ts --project=chromium --project=mobile-webkit
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
